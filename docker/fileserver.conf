# E2E용 스로틀 엔드포인트 — /slow/는 20KB/s로 서빙 (1MB ≈ 51초)
# 목적: docker 내부 통신은 1MB가 수백 ms에 완료되어 Maestro active 세그먼트 대기·
# 일시정지 탭이 즉시 완료와 경합해 구조적으로 실패하는 것을 방지.
# 통합 테스트용 빠른 경로 /testfile.bin은 location / 그대로 유지.
# 주의: root는 server 레벨에서 명시 — 이 빌드 기본 root는 /etc/nginx/html이라
# location별 root 상속에 맡기면 /slow/가 엉뚱한 경로를 찾는다 (404).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    location /slow/ {
        limit_rate 20k;
    }

    location / {
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
