services:
  aria2:
    image: p3terx/aria2-pro:test
    environment:
      - RPC_SECRET=it-secret
      - RPC_PORT=6800
      - TZ=Asia/Seoul
    ports:
      - "6800:6800"
    volumes:
      - aria2-downloads:/downloads
    # RPC warm-up race 방지 — up --wait이 실제 RPC 응답 가능 시점까지 게이트
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:6800/jsonrpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":\"h\",\"method\":\"aria2.getVersion\",\"params\":[\"token:it-secret\"]}' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  fileserver:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./docker/fileserver.conf:/etc/nginx/conf.d/default.conf:ro
    command: sh -c "head -c 1048576 /dev/urandom > /usr/share/nginx/html/testfile.bin && mkdir -p /usr/share/nginx/html/slow && cp /usr/share/nginx/html/testfile.bin /usr/share/nginx/html/slow/testfile.bin && nginx -g 'daemon off;'"
volumes:
  aria2-downloads:
